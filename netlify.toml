[build]
  command = "npm run build"

[build.environment]
  # NEXT_PUBLIC_* values are public by design: Next.js inlines them into the pages sent to
  # browsers, so Netlify's secrets scanner flags them as "leaked". They are not secrets.
  # The real secrets (GHL_PRIVATE_INTEGRATION_KEY, LEAD_WEBHOOK_URL, GHL_SUBACCOUNT_ID,
  # GHL_WORKFLOW_ID) stay server-side and remain scanned.
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_SITE_URL,NEXT_PUBLIC_GOOGLE_TAG_ID,NEXT_PUBLIC_META_PIXEL_ID,NEXT_PUBLIC_CHAT_WIDGET_ID,NEXT_PUBLIC_CHAT_WIDGET_ID_MA,GHL_SEND_DIRECT"
